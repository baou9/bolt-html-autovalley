<header class="site-header">
      <div class="header-glass-container">
        <!-- Logo -->
        <div class="logo-wrapper">
          <a href="#accueil" aria-label="Retour à l'accueil">
            <img src="https://avhtml.anyapi.ma/public/Converted-PNG.png"
                 alt="AutoValley – Full Car Service"
                 class="logo-img">
          </a>
        </div>

        <!-- Desktop Nav -->
        <nav class="desktop-nav" aria-label="Navigation principale">
          <ul class="nav-links">
            <li><a href="./index.html" class="nav-link nav-link--active">Accueil</a></li>
            <li><a href="./services.html" class="nav-link">Services</a></li>
            <li><a href="#apropos" class="nav-link">À propos</a></li>
            <li><a href="#blog"      class="nav-link">Blog</a></li>
            <li><a href="#carrieres" class="nav-link">Carrières</a></li>
            <li><a href="#faq"       class="nav-link">FAQ</a></li>
          </ul>
        </nav>

        <!-- Actions: language + CTA + burger -->
        <div class="header-actions">
          <select
            class="lang-switch"
            aria-label="Choisir la langue"
            onchange="window.location.href = this.value === 'en' ? window.location.pathname.replace('.html', '-en.html') : window.location.pathname.replace('-en.html', '.html');"
          >
            <option value="fr" selected>FR</option>
            <option value="en">EN</option>
          </select>

          <a href="#rdv" class="btn-header-magnetic">
            <span>Prendre RDV</span>
            <span class="btn-shimmer" aria-hidden="true"></span>
          </a>

          <button
              class="menu-trigger"
              type="button"
              aria-label="Ouvrir le menu"
              aria-expanded="false"
              aria-controls="mobile-nav"
          >
            <span class="hamburger">
              <span></span>
              <span></span>
            </span>
          </button>
        </div>
      </div>
    </header>

    <!-- Keep the existing hero section exactly as it is. Do NOT modify it. -->

    <!-- Mobile nav overlay – nav structure aligned with desktop -->
    <div class="mobile-nav-overlay" aria-hidden="true">
      <nav class="mobile-nav-content" id="mobile-nav" aria-label="Navigation mobile">
        <ul>
          <li style="--delay: 0.1s"><a href="./index.html" class="mobile-link">Accueil</a></li>
          <li style="--delay: 0.2s"><a href="./services.html" class="mobile-link">Services</a></li>
          <li style="--delay: 0.3s"><a href="#apropos" class="mobile-link">À propos</a></li>
          <li style="--delay: 0.4s"><a href="#blog"      class="mobile-link">Blog</a></li>
          <li style="--delay: 0.5s"><a href="#carrieres" class="mobile-link">Carrières</a></li>
          <li style="--delay: 0.6s"><a href="#faq"       class="mobile-link">FAQ</a></li>
        </ul>

        <div class="mobile-cta" style="--delay: 0.7s">
          <a href="#rdv" class="btn-mobile">Prendre RDV</a>
        </div>
      </nav>
    </div>
